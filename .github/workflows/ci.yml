name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test gates (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (rust-toolchain.toml pins stable + clippy,rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vitest run
        run: npm test

  windows-msi:
    name: Windows MSI bundle (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (rust-toolchain.toml pins stable + clippy,rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tsc && vite build -> dist/)
        run: npm run build

      - name: Build Tauri app + MSI bundle
        # WiX v3 toolset is downloaded automatically by tauri-bundler on first MSI build.
        # MSI is unsigned on purpose (plan v1); SmartScreen warning expected — documented in README.
        run: npx tauri build --bundles msi

      - name: Verify MSI artifact exists
        shell: bash
        run: ls -la src-tauri/target/release/bundle/msi/*.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: passm-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
