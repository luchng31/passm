[package]
name = "passm-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
git2.workspace = true
# Raw libgit2 FFI for global init and connect/server timeouts; builds
# everywhere (vendored libgit2, no system deps). Already in the graph via git2.
libgit2-sys = "0.18"
serde.workspace = true
uuid.workspace = true
# keyring 4.1.x: windows-native-keyring-store for the Windows desktop build.
# android-native-keyring-store is a no-op on non-Android targets (the store
# crate is target-gated to cfg(target_os = "android") in keyring's Cargo.toml),
# so enabling it here is safe for linux/macos. On Android it links the JNI
# store backend that MainActivity.kt initializes via
# io.crates.keyring.Keyring.initializeNdkContext (wired in T16).
keyring = { workspace = true, features = ["windows-native-keyring-store", "android-native-keyring-store"] }
# keyring-core is used directly on Android: keyring 4.x's `v1` facade has no
# Android branch in `set_credential_store`, so we register the native store
# with keyring-core and use `keyring_core::Entry` there.
keyring-core = "1"
passm-crypto = { path = "../passm-crypto" }
passm-vault = { path = "../passm-vault" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Reads the WinINET "system proxy" (the same setting browsers use) so the git
# transport follows it automatically, without env vars. Tiny, no transitive deps.
winreg = "0.52"

[target.'cfg(not(windows))'.dependencies]
# OpenSSL FFI for in-memory CA-bundle injection (GIT_OPT_ADD_SSL_X509_CERT).
# Unix/Android only: there libgit2 uses the OpenSSL backend, which lacks a
# system trust store on Android (git2-rs #920). On Windows libgit2 uses
# WinHTTP/Schannel with the OS trust store, so no OpenSSL is needed or linked.
openssl-sys = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0"
jni = "0.21"

[dev-dependencies]
tempfile = "3"
