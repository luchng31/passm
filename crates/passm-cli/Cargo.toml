[package]
name = "passm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
passm-crypto = { path = "../passm-crypto" }
passm-vault = { path = "../passm-vault" }
# argon2 is a transitive dep of passm-crypto; direct here so the CLI error type
# can name argon2::Error (same "make transitive dep direct" pattern as T2/T4).
argon2.workspace = true
# serde_json is not a workspace dep; needed to parse/emit vault JSON.
serde_json = "1"
# Fresh salt per encrypt / vault-add (rand 0.8 workspace pin).
rand.workspace = true